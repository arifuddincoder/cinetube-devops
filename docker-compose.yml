services:

  cinetube-frontend:
    build:
      context: https://github.com/arifuddincoder/cinetube-frontend.git
      dockerfile: Dockerfile
    container_name: cinetube-frontend
    restart: unless-stopped
    networks:
      - cinetube-network

  cinetube-backend:
    build:
      context: https://github.com/arifuddincoder/cinetube-backend.git
      dockerfile: Dockerfile
    container_name: cinetube-backend
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - cinetube-network

  nginx:
    image: nginx:alpine
    container_name: cinetube-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - cinetube-frontend
      - cinetube-backend
    networks:
      - cinetube-network

  certbot:
    image: certbot/certbot
    container_name: cinetube-certbot
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  certbot-certs:
  certbot-www:

networks:
  cinetube-network:
    driver: bridge